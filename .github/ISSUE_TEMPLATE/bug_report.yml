name: 버그 리포트
description: 잘못 동작하는 기능을 알려주세요
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 생겼나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: OS, 브라우저, 앱 버전 등
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      description: 로그, 스크린샷 등
