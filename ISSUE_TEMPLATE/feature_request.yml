name: 기능 요청
description: 새 기능이나 개선을 제안해 주세요
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 불편이나 필요가 있나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
